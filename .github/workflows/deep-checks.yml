name: Deep checks

on:
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation
        with:
          install-task: true

      - name: Run full portable validation
        run: task deep-check

  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the consumer Go floor
        uses: ./.github/actions/consumer-floor

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation
        with:
          install-task: true

      - name: Run bounded proto fuzz targets
        run: task fuzz

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          upload: never

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation
        with:
          install-task: true

      - name: Scan repository history for secrets
        run: task secret-scan
