name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - labeled
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA of the current branch head for a diagnostic run.
        required: true
        type: string
      base_sha:
        description: Full base SHA used for change classification and ref-integrity checks.
        required: true
        type: string
      full:
        description: Run every deep validation lane instead of change-based diagnostics.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.label.name == 'ci-certify' && format('pr-{0}-certification', github.event.pull_request.number) || github.event_name == 'pull_request' && format('pr-{0}-rejected-label-{1}', github.event.pull_request.number, github.run_id) || github.event_name == 'workflow_dispatch' && format('diagnostic-{0}', inputs.expected_sha) || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.label.name == 'ci-certify') || github.event_name == 'workflow_dispatch' }}

jobs:
  classify:
    name: Classify changes
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci-certify' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bound_head_sha: ${{ steps.pr_binding.outputs.head_sha }}
      bound_base_sha: ${{ steps.pr_binding.outputs.base_sha }}
      bound_merge_sha: ${{ steps.pr_binding.outputs.merge_sha }}
      ci_base_sha: ${{ steps.commit_range.outputs.base_sha }}
      merged_pr: ${{ steps.push_kind.outputs.merged_pr }}
      changed_count: ${{ steps.changes.outputs.changed_count }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      source_changed: ${{ steps.changes.outputs.source_changed }}
      dependencies_changed: ${{ steps.changes.outputs.dependencies_changed }}
      workflows_changed: ${{ steps.changes.outputs.workflows_changed }}
      platform_changed: ${{ steps.changes.outputs.platform_changed }}
      release_changed: ${{ steps.changes.outputs.release_changed }}
    steps:
      - name: Bind one-shot pull request certification
        id: pr_binding
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CERTIFICATION_LABEL: ci-certify
          CI_EVENT_LABEL: ${{ github.event.label.name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_PULL_NUMBER: ${{ github.event.pull_request.number }}
          CI_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CI_EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          CI_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if test "$CI_EVENT_LABEL" != "$CI_CERTIFICATION_LABEL"; then
            echo "::error::Label '$CI_EVENT_LABEL' is not the certification label."
            exit 1
          fi

          if ! revocation_response="$(gh api --include --silent --method DELETE \
            "repos/$CI_REPOSITORY/issues/$CI_PULL_NUMBER/labels/$CI_CERTIFICATION_LABEL" 2>&1)"; then
            if ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' <<< "$revocation_response"; then
              printf '%s\n' "$revocation_response" >&2
              exit 1
            fi
          fi

          live_pull="$(gh api "repos/$CI_REPOSITORY/pulls/$CI_PULL_NUMBER")"
          default_branch="$(gh api "repos/$CI_REPOSITORY" --jq .default_branch)"
          live_head_sha="$(jq -r .head.sha <<< "$live_pull")"
          live_base_sha="$(jq -r .base.sha <<< "$live_pull")"
          live_merge_sha="$(jq -r .merge_commit_sha <<< "$live_pull")"
          live_head_repository="$(jq -r .head.repo.full_name <<< "$live_pull")"
          live_base_repository="$(jq -r .base.repo.full_name <<< "$live_pull")"
          live_base_ref="$(jq -r .base.ref <<< "$live_pull")"
          default_branch_sha="$(gh api "repos/$CI_REPOSITORY/branches/$default_branch" --jq .commit.sha)"
          repository_normalized="$(tr '[:upper:]' '[:lower:]' <<< "$CI_REPOSITORY")"
          event_head_repository_normalized="$(tr '[:upper:]' '[:lower:]' <<< "$CI_EVENT_HEAD_REPOSITORY")"
          event_base_repository_normalized="$(tr '[:upper:]' '[:lower:]' <<< "$CI_EVENT_BASE_REPOSITORY")"
          live_head_repository_normalized="$(tr '[:upper:]' '[:lower:]' <<< "$live_head_repository")"
          live_base_repository_normalized="$(tr '[:upper:]' '[:lower:]' <<< "$live_base_repository")"

          if test "$event_head_repository_normalized" != "$repository_normalized" || test "$live_head_repository_normalized" != "$repository_normalized"; then
            echo "::error::Certification requires a same-repository pull request head."
            exit 1
          fi
          if test "$event_base_repository_normalized" != "$repository_normalized" || test "$live_base_repository_normalized" != "$repository_normalized"; then
            echo "::error::Pull request base repository does not match the workflow repository."
            exit 1
          fi
          if test "$CI_EVENT_BASE_REF" != "$default_branch" || test "$live_base_ref" != "$default_branch"; then
            echo "::error::Pull request does not target the current default branch."
            exit 1
          fi
          if test "$CI_EVENT_HEAD_SHA" != "$live_head_sha"; then
            echo "::error::Live head $live_head_sha does not match event head $CI_EVENT_HEAD_SHA."
            exit 1
          fi
          if test "$CI_EVENT_BASE_SHA" != "$live_base_sha" || test "$live_base_sha" != "$default_branch_sha"; then
            echo "::error::Pull request base is not the current default-branch tip."
            exit 1
          fi
          if test -z "$CI_EVENT_MERGE_SHA" || test "$CI_EVENT_MERGE_SHA" = null || test -z "$live_merge_sha" || test "$live_merge_sha" = null; then
            echo "::error::Synthetic merge SHA is unavailable."
            exit 1
          fi
          if test "$CI_WORKFLOW_SHA" != "$CI_EVENT_MERGE_SHA" || test "$CI_EVENT_MERGE_SHA" != "$live_merge_sha"; then
            echo "::error::Live synthetic merge SHA does not match the labeled event."
            exit 1
          fi

          {
            printf 'head_sha=%s\n' "$live_head_sha"
            printf 'base_sha=%s\n' "$live_base_sha"
            printf 'merge_sha=%s\n' "$live_merge_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && steps.pr_binding.outputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind diagnostic dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CI_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CI_BASE_SHA: ${{ inputs.base_sha }}
          CI_ACTUAL_SHA: ${{ github.sha }}
        run: ./scripts/ci/verify-dispatch.sh

      - name: Classify main push origin
        id: push_kind
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          merged_pr=false
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/main" ]]; then
            if associated_prs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPOSITORY/commits/$HEAD_SHA/pulls")"; then
              if jq -e --arg head_sha "$HEAD_SHA" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $head_sha)] | length > 0' <<< "$associated_prs" >/dev/null; then
                merged_pr=true
              fi
            else
              echo "warning: commit-to-PR lookup failed; treating push as direct" >&2
            fi
          fi
          echo "merged_pr=$merged_pr" >> "$GITHUB_OUTPUT"

      - name: Bind CI commit range
        id: commit_range
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && steps.pr_binding.outputs.base_sha || github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event_name == 'push' && github.event.before || '' }}
        run: printf 'base_sha=%s\n' "$CI_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Classify changed files
        id: changes
        env:
          CI_BASE_SHA: ${{ steps.commit_range.outputs.base_sha }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && steps.pr_binding.outputs.head_sha || github.sha }}
        run: ./scripts/ci/classify-changes.sh

  docs:
    name: Docs check
    needs: classify
    if: ${{ needs.classify.result == 'success' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run docs lane
        env:
          CI_BASE_SHA: ${{ needs.classify.outputs.ci_base_sha }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
        run: ./scripts/ci/check-docs.sh

  core:
    name: Core check
    needs: classify
    if: ${{ needs.classify.result == 'success' && !startsWith(github.ref, 'refs/tags/') && (needs.classify.outputs.docs_only != 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation
        with:
          install-task: true

      - name: Validate workflow contracts
        if: ${{ needs.classify.outputs.merged_pr != 'true' && needs.classify.outputs.workflows_changed == 'true' }}
        run: task workflow-check

      - name: Run core lane
        if: ${{ needs.classify.outputs.merged_pr != 'true' }}
        run: task check

      - name: Run race lane
        if: ${{ needs.classify.outputs.merged_pr != 'true' }}
        run: task race

      - name: Run reduced merged-main smoke
        if: ${{ needs.classify.outputs.merged_pr == 'true' }}
        run: task smoke

      - name: Run dependency lane
        if: ${{ needs.classify.outputs.merged_pr != 'true' && (needs.classify.outputs.dependencies_changed == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
        run: task dependency-gate

      - name: Run platform lane
        if: ${{ needs.classify.outputs.merged_pr != 'true' && (needs.classify.outputs.platform_changed == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
        run: task platform-check

  floor:
    name: Go floor
    needs: classify
    if: ${{ needs.classify.result == 'success' && (startsWith(github.ref, 'refs/tags/') || (needs.classify.outputs.merged_pr != 'true' && (needs.classify.outputs.docs_only != 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation

      - name: Resolve the consumer Go floor
        id: go_floor
        shell: bash
        run: |
          set -euo pipefail
          floor_version="$(go list -m -f '{{.GoVersion}}')"
          if [[ ! "$floor_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unexpected go.mod Go version: $floor_version"
            exit 1
          fi
          IFS=. read -r floor_major floor_minor _ <<< "$floor_version"
          printf 'version=%s.%s\n' "$floor_major" "$floor_minor" >> "$GITHUB_OUTPUT"

      - name: Set up latest patch of the consumer Go floor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go_floor.outputs.version }}
          check-latest: true
          cache: false

      - name: Test with the consumer Go floor
        run: |
          go version
          GOTOOLCHAIN=local go test ./...

  fuzz:
    name: Proto fuzz smoke
    needs: [classify, core]
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.merged_pr != 'true' && needs.core.result == 'success' && (needs.classify.outputs.source_changed == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation
        with:
          install-task: true

      - name: Run bounded proto fuzz targets
        run: task fuzz

  codeql:
    name: CodeQL smoke
    needs: [classify, core]
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.merged_pr != 'true' && needs.core.result == 'success' && (needs.classify.outputs.source_changed == 'true' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          upload: never

  secret_scan:
    name: Secret scan
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.merged_pr != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation

      - name: Scan changed history for secrets
        env:
          CI_BASE_SHA: ${{ needs.classify.outputs.ci_base_sha }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
        run: GITLEAKS_GO_RUN_VERSION="$GITLEAKS_VERSION" ./scripts/ci/check-secrets.sh

  release:
    name: Release check
    needs: classify
    if: ${{ needs.classify.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up validation toolchain
        uses: ./.github/actions/setup-validation
        with:
          install-task: true

      - name: Run release lane
        run: task release-check

  ci_required:
    name: ${{ github.event_name == 'pull_request' && github.event.label.name != 'ci-certify' && 'ci-rejected-label' || 'ci-required' }}
    if: ${{ always() }}
    needs: [classify, docs, core, floor, fuzz, codeql, secret_scan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unrelated label without certification
        if: ${{ always() && github.event_name == 'pull_request' && github.event.label.name != 'ci-certify' }}
        env:
          CI_EVENT_LABEL: ${{ github.event.label.name }}
        run: echo "::notice::Label '$CI_EVENT_LABEL' did not request certification."

      - name: Reject cancellation, failed binding, or classification
        if: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci-certify') && (cancelled() || needs.classify.result != 'success') }}
        run: |
          echo "::error::Pull request certification binding or change classification failed."
          exit 1

      - name: Check out repository
        if: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci-certify') && needs.classify.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && needs.classify.outputs.bound_head_sha || github.sha }}
          persist-credentials: false

      - name: Require selected CI lanes
        if: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'ci-certify') && needs.classify.result == 'success' }}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
          CI_MERGED_PR: ${{ needs.classify.outputs.merged_pr }}
          CI_REF: ${{ github.ref }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          SOURCE_CHANGED: ${{ needs.classify.outputs.source_changed }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CORE_RESULT: ${{ needs.core.result }}
          FLOOR_RESULT: ${{ needs.floor.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: ./scripts/ci/require-results.sh
