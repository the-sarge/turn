version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
      timezone: America/New_York
    labels:
      - dependencies
      - go
    groups:
      go-modules:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the second entry covers the nested
    # composite action manifest, which the root directory does not scan.
    directories:
      - /
      - /.github/actions/setup-validation
    schedule:
      interval: weekly
      day: tuesday
      time: '11:00'
      timezone: America/New_York
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'
