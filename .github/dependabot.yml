version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
      timezone: America/New_York
    labels:
      - dependencies
      - go
    groups:
      go-modules:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; explicitly include nested composite actions.
    directories:
      - /
      - /.github/actions/setup-validation
      - /.github/actions/consumer-floor
    schedule:
      interval: weekly
      day: tuesday
      time: '11:00'
      timezone: America/New_York
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'
